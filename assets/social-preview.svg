<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- canvas -->
  <rect width="1280" height="640" fill="#FFFFFF"/>

  <!-- top yellow band -->
  <rect x="0" y="0" width="1280" height="56" fill="#FFD81F"/>

  <!-- thick black border -->
  <rect x="6" y="6" width="1268" height="628" fill="none" stroke="#0A0A0A" stroke-width="12"/>

  <!-- header line in yellow band: numbered tag + version, mini chart at right -->
  <g font-family="ui-monospace, 'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace">
    <text x="80" y="38" font-size="20" font-weight="600" letter-spacing="0.18em" fill="#0A0A0A">
      01 ── TOKMETER ── v0.1.0
    </text>
    <g transform="translate(1090, 14)" fill="#0A0A0A">
      <rect x="0"  y="20" width="6" height="16"/>
      <rect x="10" y="14" width="6" height="22"/>
      <rect x="20" y="8"  width="6" height="28"/>
      <rect x="30" y="20" width="6" height="16"/>
      <rect x="40" y="4"  width="6" height="32"/>
      <rect x="50" y="12" width="6" height="24"/>
      <rect x="60" y="0"  width="6" height="36"/>
      <rect x="70" y="6"  width="6" height="30"/>
      <rect x="80" y="2"  width="6" height="34"/>
      <rect x="90" y="14" width="6" height="22"/>
    </g>
  </g>

  <!-- main wordmark -->
  <text x="80" y="340"
        font-family="'Inter', 'Helvetica Neue', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="200" font-weight="900"
        letter-spacing="-0.05em" fill="#0A0A0A">tokmeter</text>

  <g font-family="ui-monospace, 'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace" fill="#0A0A0A">
    <!-- rule under wordmark -->
    <line x1="80" y1="385" x2="180" y2="385" stroke="#0A0A0A" stroke-width="3"/>

    <!-- tagline -->
    <text x="80" y="430" font-size="28" font-weight="500">local dashboard for what claude code +</text>
    <text x="80" y="468" font-size="28" font-weight="500">codex cli actually cost you.</text>

    <!-- install pill -->
    <rect x="80" y="540" width="320" height="60" fill="#FFD81F" stroke="#0A0A0A" stroke-width="3"/>
    <text x="100" y="580" font-size="24" font-weight="600">$ uvx tokmeter</text>

    <!-- repo url -->
    <text x="430" y="580" font-size="22" font-weight="500">github.com/lich99/tokmeter</text>
  </g>
</svg>
