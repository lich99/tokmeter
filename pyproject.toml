[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "tokmeter"
version = "0.2.1"
description = "Fast, local Claude Code and Codex token usage dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "lich99", email = "lichenghai99@gmail.com"}]
dependencies = ["polars>=1.30", "numpy>=1.24", "tzdata>=2025.1; sys_platform == 'win32'"]

[project.scripts]
tokmeter = "tokmeter.cli:main"

[project.urls]
Homepage = "https://github.com/lich99/tokmeter"
Repository = "https://github.com/lich99/tokmeter"
Issues = "https://github.com/lich99/tokmeter/issues"

[dependency-groups]
dev = ["pytest>=8", "maturin>=1.9,<2"]

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "python"
module-name = "tokmeter._native"
features = ["pyo3/extension-module"]
include = ["python/tokmeter/static/**/*", "python/tokmeter/prices.json", { path = "LICENSE", format = "sdist" }, { path = "tests/**/*", format = "sdist" }, { path = "scripts/benchmark.py", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
