[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokmeter"
version = "0.1.0"
description = "Local dashboard for Claude Code & Codex CLI token cost"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "lich99" }]
keywords = ["claude-code", "codex", "anthropic", "openai", "cost", "tokens", "dashboard"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
  "Topic :: Utilities",
]
dependencies = ["polars>=1.0"]

[project.scripts]
tokmeter = "tokmeter:main"

[project.urls]
Homepage = "https://github.com/lich99/tokmeter"
Repository = "https://github.com/lich99/tokmeter"
Issues = "https://github.com/lich99/tokmeter/issues"

[tool.hatch.build.targets.wheel]
# Source tree is flat (tokmeter.py + dashboard.html at root) so PEP 723
# `uv run tokmeter.py` works without restructuring. For the installed wheel
# we relocate both files into a tokmeter/ package so they live alongside one
# another in site-packages and Path(__file__).parent / "dashboard.html"
# resolves correctly. Same lookup works in both modes.
only-include = ["tokmeter.py", "dashboard.html"]
sources = { "tokmeter.py" = "tokmeter/__init__.py", "dashboard.html" = "tokmeter/dashboard.html" }

[tool.hatch.build.targets.sdist]
include = ["tokmeter.py", "dashboard.html", "README.md", "LICENSE", "pyproject.toml"]
