[package]
name = "tokmeter-native"
version = "0.2.1"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "Native incremental JSONL reader for tokmeter"
repository = "https://github.com/lich99/tokmeter"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.27.2", optional = true, features = ["abi3-py310"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
memchr = "2.8"

[profile.release]
lto = "thin"
codegen-units = 1
